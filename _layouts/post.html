---
layout: default
---
<article class="post">
  <p class="crumb"><a href="{{ '/guides/' | relative_url }}">攻略</a>{% if page.category_name %} › {{ page.category_name }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <p class="meta">發布：{{ page.date | date: '%Y/%m/%d' }}{% if page.updated %}　更新：{{ page.updated | date: '%Y/%m/%d' }}{% endif %}</p>
  <div class="post-body">
    {{ content }}
  </div>
</article>
