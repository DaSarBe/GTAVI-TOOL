- id: w-blackeagle-m306
  name: Black Eagle Import M306 TMR
  type: weapon
  subtype: 戰術步槍（特殊版本，不能改裝）
  region: Balsero
  approx: true
  location: Balsero 的 Black Eagle 倉庫（在 Black Eagle 槍店旁邊），倉庫內一間有柵欄的房間。
  puzzle: true
  steps:
    - 前往 Balsero 的 Black Eagle 倉庫。
    - 找到裡面有柵欄的房間。
    - 進入方法有兩種：用堆高機把擋住的箱子移開，或用 Lucia 從狹縫鑽進去（進入方法目前僅單一來源）。
  status: 已確認
  sources:
    - https://www.gtabase.com/gta-6/weapons/black-eagle-import-m306-tmr
    - https://beebom.com/gta-6-secret-silenced-m306-tmr-rifle/

- id: w-blackeagle-kalinga
  name: Black Eagle Import Kalinga
  type: weapon
  subtype: 手槍（Kalinga .50 特殊版本，不能改裝）
  region: Balsero
  approx: true
  location: 同一座 Black Eagle 倉庫，前方角落的辦公室保險箱裡。
  puzzle: true
  steps:
    - 前往 Balsero 的 Black Eagle 倉庫，進入前方角落的辦公室（門上有密碼鎖）。
    - 查看辦公室電腦的登入畫面，上面會顯示保險箱密碼。
    - 輸入密碼打開保險箱，免費拿到手槍。
    - 提醒：網路上有攻略說 GTA6 部分保險箱的密碼是隨機的，請以你遊戲裡電腦畫面上的數字為準。
  status: 已確認
  sources:
    - https://www.gtabase.com/gta-6/weapons/black-eagle-import-kalinga
    - https://www.powerpyx.com/?p=373620
    - https://www.pcgamer.com/games/grand-theft-auto/gta-6-safe-codes-combinations/

- id: w-sm69-keylento
  name: Shrewsbury SM-69
  type: weapon
  subtype: 狩獵狙擊槍
  region: Key Lento
  approx: true
  location: Key Lento，Nifty Threads Island Wear 服飾店上方，右側那座塔的頂端。
  puzzle: false
  steps:
    - 前往 Key Lento 的 Nifty Threads Island Wear。
    - 爬上右側的塔（可以從圍欄爬上去）。
    - 塔頂可以免費拿到，附 5 發子彈。
    - 不想爬的話，也可以在擴充版槍店花 $1,850 購買。
  status: 單一來源
  sources:
    - https://games.gg/grand-theft-auto-vi/guides/grand-theft-auto-6-secret-sniper-location/

