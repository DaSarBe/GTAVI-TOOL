# ===== 隱藏武器與車輛資料 =====
# 欄位說明：
#   id:        唯一代號（上線後不要改）
#   name:      遊戲內英文名稱
#   name_zh:   中文俗稱（可省略）
#   type:      weapon（武器）或 vehicle（車輛／載具）
#   subtype:   例如 手槍、步槍、跑車、機車、船、飛機
#   region:    地區（Vice City、Leonida Keys、Grassrivers、Port Gellhorn、Ambrosia、Mount Kalaga）
#   x, y:      在底圖上的像素座標（左上角為 0,0）
#   approx:    true = 依文字描述放的大約位置，尚未實地確認
#   location:  位置描述
#   puzzle:    true = 需要解謎／闖關
#   steps:     解鎖流程（每步一行）
#   video:     YouTube 影片網址（可省略）；video_title：影片標題
#   status:    已確認 / 單一來源
#   sources:   參考來源網址
# 注意：x、y 座標等官方地圖底圖放上後才會填入；沒有座標的項目只會出現在下方清單。

- id: w-assassin-nipper
  name: Assassin Nipper .38
  type: weapon
  subtype: 手槍（特殊版本）
  region: Permit Keys
  approx: true
  location: Permit Keys 東南方小島的最南端，沙灘上擱淺的一艘破舊木船（有攻略稱為間諜船）。
  puzzle: false
  steps:
    - 從 Key Lento 搭船或水上摩托車往南，前往 Permit Keys 東南方的小島。
    - 在小島南端的沙灘找到擱淺的破船。
    - 爬上船，打開甲板上的艙口即可拿到（艙口細節目前僅單一來源）。
    - 順路可以到最北邊的小島拿 Smuggler's Gorse 425 霰彈槍。
  video: "https://www.youtube.com/watch?v=Ce47LOQauQY"
  video_title: "GTA 6 Secret SILENCED PISTOL Location! (Assassin Nipper .38)"
  status: 已確認
  sources:
    - https://games.gg/grand-theft-auto-vi/guides/grand-theft-auto-6-assassin-pistol-smuggler-shotgun-locations/
    - https://www.gtabase.com/gta-6/weapons/assassin-nipper-38
    - https://beebom.com/gta-6-secret-silenced-pistol-location/

