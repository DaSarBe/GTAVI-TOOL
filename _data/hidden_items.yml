- id: v-p996-lazer
  x: 790
  y: 3170
  name: P-996 Lazer
  name_zh: 戰鬥機
  type: vehicle
  subtype: 戰鬥機
  region: Mile Zero Air Station
  approx: true
  location: Leonida 西南方的 Mile Zero Air Station 軍事基地，基地北半部的機場和機庫。
  puzzle: true
  steps:
    - 完成 Jason 的第一個任務後就能前往（第一章）。
    - 進入基地有三種方式：從東南側的特技跳台飛進圍牆內（最不容易爆發槍戰）、從東側大門硬闖，或直接開進去（進入禁區就會被通緝）。
    - 到基地北半部的機庫找到 P-996 Lazer，下車後抓住駕駛艙旁的邊緣爬進去。
    - 起飛後會被高星通緝（有攻略說 4～5 星，最高到 6 星），飛低一點比較不容易被發現。
  video: "https://www.youtube.com/watch?v=4HCd052lpnA"
  video_title: "GTA 6: You Can Steal a Fighter Jet in Chapter 1 (But Probably Shouldn't) | IGN"
  status: 已確認
  sources:
    - https://www.destructoid.com/how-to-steal-a-fighter-jet-from-the-military-base-in-gta-6/
    - https://beebom.com/how-to-get-jets-in-gta-6/
    - https://slashgear.com/2321327/gta-6-how-to-steal-fighter-jet-from-military-base-location/
