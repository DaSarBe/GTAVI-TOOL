- id: v-paul-walker-eclipse
  name: Maibatsu '97 Penumbra FF
  name_zh: Paul Walker 致敬車
  type: vehicle
  subtype: 跑車（彩蛋車）
  region: Vespucci Island
  approx: true
  location: Vice City 的 Vespucci Island，一棟別墅的車庫裡。綠色車身，致敬《玩命關頭》第一集 Brian O'Conner 的 1995 Mitsubishi Eclipse。
  puzzle: false
  steps:
    - 開放自由行動後就能去，不用等後期章節。
    - 前往 Vespucci Island 的別墅，進入後破門闖進車庫。
    - 把車開走，之後可以登記成自己的車。
    - 彩蛋：打開後車廂會有蛇跳出來攻擊你，致敬《玩具總動員》胡迪的台詞「我的靴子裡有條蛇」（英文的 boot 也是後車廂的意思）。
  status: 已確認
  sources:
    - https://insider-gaming.com/paul-walker-gta-6-easter-egg/
    - https://www.gfinityesports.com/article/gta-6-how-to-find-the-fast-furious-1995-mitsubishi-eclipse
    - https://games.gg/grand-theft-auto-vi/guides/grand-theft-auto-6-paul-walker-car-location-how-to-get/
    - https://www.bgr.com/2322463/gta-6-hidden-fast-and-furious-paul-walker-car/

- id: v-p996-lazer
  name: P-996 Lazer
  name_zh: 戰鬥機
  type: vehicle
  subtype: 戰鬥機
  region: Mile Zero Air Station
  approx: true
  location: Leonida Keys 西邊的 Mile Zero Air Station 軍事基地，基地北半部的機場和機庫。
  puzzle: true
  steps:
    - 完成 Jason 的第一個任務後就能前往（第一章）。
    - 進入基地有三種方式：從東南側的特技跳台飛進圍牆內（最不容易爆發槍戰）、從東側大門硬闖，或直接開進去（進入禁區就會被通緝）。
    - 到基地北半部的機庫找到 P-996 Lazer，下車後抓住駕駛艙旁的邊緣爬進去。
    - 起飛後會被高星通緝（有攻略說 4～5 星，最高到 6 星），飛低一點比較不容易被發現。
  status: 已確認
  sources:
    - https://www.destructoid.com/how-to-steal-a-fighter-jet-from-the-military-base-in-gta-6/
    - https://beebom.com/how-to-get-jets-in-gta-6/
    - https://slashgear.com/2321327/gta-6-how-to-steal-fighter-jet-from-military-base-location/
    - https://games.gg/grand-theft-auto-vi/guides/gta-6-fighter-jet-location/
